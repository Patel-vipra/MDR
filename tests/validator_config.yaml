phase1:
  employees: 200
  departments: 12
  projects: 40
  vendors: 30
  docs_finance: 30
  docs_engineering: 25
  docs_hr: 25
  docs_legal: 20
  docs_total: 100
  queries_total: 80
  queries_single_hop: 50
  queries_multi_hop: 15
  queries_unanswerable: 10
  queries_abac_denied: 5
  cross_domain_entity_overlap_employees: 20
  cross_domain_entity_overlap_projects: 10
  spot_read_min_words: 200
  spot_read_entities_min: 2

phase2:
  clean_count: 60
  degraded_count: 40
  entity_survival_threshold: 0.95
  fuzzy_match_threshold: 90

phase3:
  # Corrected from an original 1300-1600 estimate (PLAN.md §6.2) — the actual 100-doc
  # corpus totals ~61K tokens, which caps out far below that at the 450-token chunk
  # target. See docs/open-items.md for the measurement. Doesn't reopen D11.
  chunk_count_min: 200
  chunk_count_max: 350
  embedding_dim: 1024
  # History (docs/open-items.md #4): GPT-4.1 Nano's zero-shot recall topped out at
  # ~67%, so this was lowered from the original 0.80 to 0.60. Switching extraction
  # to GPT-4.1 (full) then measured 94.1% node recall — clearing the *original*
  # target, not just the lowered one — so this is raised back up to 0.85 (margin
  # below the measured value, same principle as the chunk-count correction above).
  graph_node_coverage_min: 0.85

phase4:
  query_timeout_seconds: 120
  abac_denied_count: 5
  unanswerable_count: 10
  min_abstention_rate: 0.70
  max_crag_retries: 1

phase5:
  configs: ["A0", "A1", "A2", "A3", "A4", "A5"]
  repetitions: 3
  multi_hop_query_count: 15
  crag_crosscheck_sample: 25

phase6:
  base_url: http://localhost:8000
  expected_documents: 100
  expected_configs: [A0, A1, A2, A3, A4, A5]
  # P6.02 streams a real query. An ABAC-denied one short-circuits at the domain
  # router (~2s) instead of paying the ~54s p50 of a full retrieval+generation
  # pass, while still exercising the entire SSE path end to end.
  probe_query: "Who reviewed Shannon Jones in FY25-Q4?"
  probe_persona: engineer
  query_timeout_seconds: 180

seed: 42
